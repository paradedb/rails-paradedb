# workflows/ci.yml
#
# CI
# Run lint, test matrix, and example checks for pull requests and main.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: postgres

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: .ruby-version

      - name: Install RuboCop
        run: gem install rubocop --no-document

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Run RuboCop lint cops
        run: |
          rubocop --version
          rubocop --lint \
            lib \
            spec \
            rails-paradedb.gemspec \
            Rakefile

      - name: Check API coverage
        run: uv run --with json5 scripts/check_api_coverage.py

      - name: Test tooling scripts
        run: uv run --with json5 python -m unittest discover -s scripts/tests -p "test_*.py"

      - name: Package install smoke test
        run: bash scripts/smoke_package_install.sh

  matrix-tests:
    name: Ruby ${{ matrix.runtime.ruby-version }} / Rails ${{ matrix.runtime.rails-version }} / PG ${{ matrix.postgres-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres-version: ["15", "16", "17", "18"]
        runtime:
          - rails-version: "7.2"
            ruby-version: "3.4"
            gemfile: "gemfiles/rails72.gemfile"
          - rails-version: "8.1"
            ruby-version: "3.4"
            gemfile: "Gemfile"
          - rails-version: "8.1"
            ruby-version: "4.0"
            gemfile: "Gemfile"

    services:
      paradedb:
        image: paradedb/paradedb:0.27.0-pg${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      BUNDLE_GEMFILE: ${{ matrix.runtime.gemfile }}
      PARADEDB_TEST_DSN: postgresql://postgres:postgres@localhost:5432/postgres
      PGPASSWORD: postgres
      COVERAGE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Ruby ${{ matrix.runtime.ruby-version }}
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: ${{ matrix.runtime.ruby-version }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ./coverage/coverage.xml
          flags: rails-paradedb,rb${{ matrix.runtime.ruby-version }},rl${{ matrix.runtime.rails-version }},pg${{ matrix.postgres-version }}
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
